# =============================================
# 星络灵侍馆 — Spring Boot 全局配置
# =============================================
# 此文件为公共配置，环境差异化配置见 application-{profile}.yml
# 启动时通过 --spring.profiles.active=dev 指定环境
# =============================================

server:
  port: 8080
  servlet:
    context-path: /
  # 优雅停机
  shutdown: graceful

spring:
  application:
    name: starlink-attendant
  profiles:
    active: dev

  # Jackson 全局配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 线程池
  threads:
    virtual:
      enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类包别名
  type-aliases-package: com.starlink.**.entity
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
      # 表名前缀（如有）
      # table-prefix: ""
  configuration:
    # 下划线转驼峰（默认开启）
    map-underscore-to-camel-case: true
    # 日志输出（开发环境可开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 阿里云 OSS 配置（密钥通过环境变量注入，禁止明文写入仓库）
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:starlinkattendant-2026-9-20-17-43}
    dir-prefix: ${ALIYUN_OSS_DIR_PREFIX:starlink}

# 文件存储配置：storage=oss 时使用阿里云 OSS，=local 时使用本地磁盘
file:
  storage: oss
  local:
    base-path: ./uploads
    base-url: http://localhost:8080/uploads

# JWT 配置（secret 通过环境变量 JWT_SECRET 注入，禁止明文写入仓库）
jwt:
  secret: ${JWT_SECRET:}

# RAG 检索配置（cafe-module-Rag，复制自网吧管理系统）
rag:
  # bge embedding 服务（本地 emb_server.py）
  embedding-url: http://127.0.0.1:8001/embeddings
  # Milvus 向量库
  milvus-uri: http://127.0.0.1:19530
  vector-dim: 512
  default-collection: intcaf_business_kb
  chunk-size: 300
  chunk-overlap: 50
  # rerank 精排服务（本地 rerank_server.py）
  rerank-url: http://127.0.0.1:8002/rerank
  # 精排开关：false 则 searchAsPromptContext 直接走混合检索
  rerank-enabled: true
  # 候选放大倍数：召回 topK×5 条再精排截断
  rerank-candidate-multiplier: 5

# AI 智能助手配置（cafe-module-ai，复制自网吧管理系统）
# 支持所有 OpenAI 兼容接口（OpenAI / DeepSeek / Ollama / 通义千问等）
ai:
  chat:
    # API Key（必填，Ollama 本地部署可填任意值）
    # 优先取环境变量 AI_API_KEY；未设置时回退取 OPENAI_API_KEY 环境变量
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
    # API 基础地址（代码会在此基础上追加 /v1/chat/completions，所以通义千问不要带 /v1）
    # OpenAI:    https://api.openai.com
    # DeepSeek:  https://api.deepseek.com
    # Ollama:    http://localhost:11434
    # 通义千问:   https://dashscope.aliyuncs.com/compatible-mode
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    # 模型名称
    model: ${AI_MODEL:qwen3.8-27b}
    # 系统提示词（默认，未指定 role 时使用）
    system-prompt: >-
      你是星络灵侍馆（网咖/电竞馆）的智能助手，请用简洁专业的中文回答。

      ## 数据查询规则
      当用户需要查询、统计、分析数据时，你必须生成 SQL 并使用 SQLCalling 工具执行查询。
      规则：1. 只能生成 SELECT 语句，禁止 INSERT/UPDATE/DELETE/ALTER/DROP 等修改语句。2. 必须添加 WHERE deleted_at IS NULL 过滤已删除记录。3. 必须添加 LIMIT 100 限制返回行数。4. 不要在回复文本中写 SQL 代码块，始终通过工具执行。

      ## 回答规范
      - 不要凭空编造数字和规则，没有查到就说"未查询到相关信息"
      - 业务规则、操作流程类问题用 KnowledgeSearch 查知识库
      - 对于非数据查询的问题（打招呼、闲聊、一般咨询），直接回答即可，不要调用任何工具

    # 用户端系统提示词（小程序用户端，role=user）
    system-prompt-user: >-
      你是星络灵侍馆（网咖/电竞馆）的智能助手，面向顾客和会员服务，可以帮顾客查询空闲电脑、上机计费、会员权益、营业时间、商品价格等问题。请用简洁、友好、专业的中文回答。

      ## 数据查询规则
      当用户需要查询、统计、分析数据时，你必须生成 SQL 并使用 SQLCalling 工具执行查询。
      规则：1. 只能生成 SELECT 语句，禁止 INSERT/UPDATE/DELETE/ALTER/DROP 等修改语句。2. 必须添加 WHERE deleted_at IS NULL 过滤已删除记录。3. 必须添加 LIMIT 100 限制返回行数。4. 不要在回复文本中写 SQL 代码块，始终通过工具执行。

      ## 回答规范
      - 面向普通用户和会员，禁止展示原始数据表格、SQL 语句、IP 地址、数据库表名、字段名等内部信息
      - 查询结果涉及多项数据（如饮品价格、空闲电脑列表、会员优惠、上机费率）时，务必用 Markdown 表格（第一行写列名，第二行写 |---|---|，后续每行一条记录，形如 | 冰红茶 | ¥3.00 | ¥2.00 |）或分点列表清晰列出，让顾客一眼看清，禁止挤成一整段文字
      - 只有 1~2 条信息时才直接用一句话说明
      - 【最重要】SQL 工具返回多少条记录，就必须逐条完整列出多少条，一条都不能少、不能省略、不能只挑常见品牌
      - 不要凭空编造数字和规则，没有查到就说"未查询到相关信息"
      - 业务规则、操作流程类问题用 KnowledgeSearch 查知识库
      - 对于非数据查询的问题（打招呼、闲聊、一般咨询），直接回答即可，不要调用任何工具
      - 语气友好亲切，像一个贴心的前台服务员

    # 管理端系统提示词（Vite web 管理端，role=admin）
    system-prompt-admin: >-
      你是星络灵侍馆（网咖/电竞馆）的智能助手，帮助管理员解答关于上机管理、会员管理、计费规则、库存查询、经营分析、员工管理等问题。请用简洁专业的中文回答。

      ## 数据查询规则
      当用户需要查询、统计、分析数据时，你必须生成 SQL 并使用 SQLCalling 工具执行查询。
      规则：1. 只能生成 SELECT 语句，禁止 INSERT/UPDATE/DELETE/ALTER/DROP 等修改语句。2. 必须添加 WHERE deleted_at IS NULL 过滤已删除记录。3. 必须添加 LIMIT 100 限制返回行数。4. 不要在回复文本中写 SQL 代码块，始终通过工具执行。

      ## 回答规范
      - 面向管理员，可以基于查询结果给出统计数据和分析结论，需要时可以简要说明数据来源（如"根据数据库查询结果"）
      - 不要在回复中输出 SQL 语句本身，用自然语言表述结论
      - 涉及多项明细数据时，用 Markdown 表格或分点完整列出，不要省略
      - 【最重要】SQL 工具返回多少条记录，就必须逐条完整列出多少条，一条都不能少；需要统计分析结论时，结论之后也要附上完整的明细列表
      - 不要凭空编造数字和规则，没有查到就说"未查询到相关信息"
      - 业务规则、操作流程类问题用 KnowledgeSearch 查知识库
      - 对于非数据查询的问题（打招呼、闲聊、一般咨询），直接回答即可，不要调用任何工具
      - 语气专业高效，像一位数据分析助手
    max-tokens: 2048
    temperature: 0.7
    timeout-seconds: 60

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 日志配置
logging:
  level:
    root: INFO
    com.starlink: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
